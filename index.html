  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>TDM-READY — Checklist de prontidão para o gerenciamento de dívida técnica<\u002Ftitle>\n\n<script src=\"5a694023-2940-49b3-9175-f60b8ab25814\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  *{box-sizing:border-box;}\n  body{margin:0;}\n  ::-webkit-scrollbar{width:10px;height:10px;}\n  ::-webkit-scrollbar-thumb{background:#c7cedd;border-radius:8px;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#e4e7eb;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1f2733;-webkit-font-smoothing:antialiased;\">\n\n  <div style=\"background:#334155;padding:22px 0;color:#fff;\">\n    <div style=\"max-width:1416px;margin:0 auto;padding:0 32px;display:flex;flex-direction:column;gap:7px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c7cedd\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <span style=\"font-size:25px;font-weight:800;letter-spacing:.3px;color:#fff;\">TDM-READY<\u002Fspan>\n        <span style=\"background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;color:#c7cedd;\">Gerenciamento de Dívida Técnica<\u002Fspan>\n        <button onclick=\"{{ onToggleHelp }}\" title=\"Orientações de uso\" style=\"margin-left:auto;flex:none;width:32px;height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.10);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1;\">?<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:14px;color:#fff;\">Checklist de avaliação da prontidão organizacional para adoção do gerenciamento de dívida técnica<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  \n  <sc-if value=\"{{ showHelp }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1416px;margin:0 auto;padding:24px 32px 0;\">\n      <div style=\"background:#fff;border:1px solid #e6e9f2;border-radius:14px;padding:20px 24px;box-shadow:0 1px 2px rgba(20,30,60,.04);\">\n        <div style=\"font-size:16px;font-weight:700;color:#1f2733;margin-bottom:2px;\">Como conduzir a sessão<\u002Fdiv>\n        <div style=\"font-size:13px;color:#525a6b;line-height:1.6;\">A aplicação do TDM-READY é coletiva e ocupa entre 45 minutos e 1h30, conforme o tamanho do grupo e a profundidade do debate. Reserve o tempo integral: o esforço não está em operar o checklist, e sim em deliberar até uma resposta única por item, e um único item pode consumir vários minutos de discussão.<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:#1f2733;margin:14px 0 5px;\">Quem participa<\u002Fdiv>\n        <div style=\"font-size:13px;color:#525a6b;line-height:1.6;\">Reúna participantes que cubram os papéis entre os quais o conhecimento sobre as condições está distribuído: desenvolvimento em diferentes níveis de senioridade, arquitetura, engenharia de qualidade, gestão de produto, gestão da área de tecnologia e representantes de negócio com influência sobre orçamento, prioridade e prazo. Esses perfis são uma sugestão, não uma exigência, já que as denominações variam entre organizações e outros papéis podem ser pertinentes ao seu contexto. O que importa é a cobertura, porque treze dos vinte e um itens avaliam condições da organização, e não da área de tecnologia.<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:#1f2733;margin:14px 0 5px;\">O papel do mediador<\u002Fdiv>\n        <div style=\"font-size:13px;color:#525a6b;line-height:1.6;\">Designe um mediador da própria organização. Cabe a ele conduzir ativamente a sessão, orientar o entendimento e direcionar o preenchimento. Antes de reunir o grupo, o mediador deve percorrer o checklist sozinho, em preenchimento simulado, sem compromisso com o diagnóstico, para conhecer os itens, as descrições e as questões de apoio. Durante a sessão, cabe-lhe explicitar as posições divergentes antes de registrar a resposta do grupo, para que o consenso não apague a discordância.<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:#1f2733;margin:14px 0 5px;\">Sobre as questões de apoio<\u002Fdiv>\n        <div style=\"font-size:13px;color:#525a6b;line-height:1.6;\">Elas orientam a deliberação e não determinam a resposta. Não são uma lista a pontuar: responder afirmativamente a duas de três não significa que a condição esteja presente. A resposta decorre da condição avaliada, enunciada na formulação do item; as questões servem para dar concretude à discussão e sugerir onde procurar evidência.<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:#1f2733;margin:14px 0 5px;\">Sobre os itens sem resposta<\u002Fdiv>\n        <div style=\"font-size:13px;color:#525a6b;line-height:1.6;\">Deixar um item em branco é uma opção legítima, para quando o grupo não dispõe de informação ou não alcança acordo. No panorama, esses itens aparecem em cinza, distintos das condições ausentes. Não representam falta de dado: não conseguir avaliar uma condição já é um resultado, e costuma indicar que ela não está clara, visível ou governada na organização.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"max-width:1416px;margin:0 auto;padding:24px 32px 64px;\">\n\n    <div style=\"background:#fff;border:1px solid #e6e9f2;border-radius:14px;padding:20px 24px;box-shadow:0 1px 2px rgba(20,30,60,.04);margin-bottom:16px;\">\n      <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:18px;\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:#eef1f7;color:#1f2733;flex:none;\">\n          <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.21 15.89A10 10 0 1 1 8 2.83\"><\u002Fpath><path d=\"M22 12A10 10 0 0 0 12 2v10z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"font-size:16px;font-weight:700;color:#1f2733;\">Preenchimento do checklist<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7385;\">Quanto do checklist já foi respondido<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ reset }}\" style=\"flex:none;border:1px solid #dfe3ee;background:#fff;color:#6b7385;padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;\">Reiniciar<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px;\">\n        <div style=\"text-align:center;\">\n          <div style=\"font-size:30px;font-weight:800;color:#1f2733;line-height:1;\">{{ pctTotalLabel }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7385;margin-top:7px;\">Preenchido<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;\">\n          <div style=\"font-size:30px;font-weight:800;color:#1f2733;line-height:1;\">{{ totalLabel }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7385;margin-top:7px;\">Itens Respondidos<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;\">\n          <div style=\"font-size:30px;font-weight:800;color:#1f2733;line-height:1;\">{{ pending }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7385;margin-top:7px;\">Itens Pendentes<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#6b7385;margin-bottom:7px;\">\n        <span style=\"font-weight:600;color:#1f2733;\">Preenchimento<\u002Fspan>\n        <span>{{ totalDone }} de {{ total }} respondidos<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:8px;border-radius:999px;background:#eceff5;overflow:hidden;\">\n        <div style=\"height:100%;width:{{ overallWidth }};background:#334155;border-radius:999px;transition:width .35s ease;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start;\">\n      <sc-for list=\"{{ sections }}\" as=\"section\" hint-placeholder-count=\"3\">\n        <div style=\"background:{{ section.tint }};border:1px solid {{ section.border }};border-radius:14px;padding:16px;\">\n\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:{{ section.headMargin }};\">\n            <div style=\"width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:{{ section.accent }};border:1px solid {{ section.border }};flex:none;\">\n              <sc-if value=\"{{ section.isPessoas }}\" hint-placeholder-val=\"{{ false }}\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ section.isProcessos }}\" hint-placeholder-val=\"{{ false }}\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ section.isTecnologia }}\" hint-placeholder-val=\"{{ false }}\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M8 21h8\"><\u002Fpath><path d=\"M12 17v4\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"font-weight:700;font-size:16px;color:{{ section.accent }};\">{{ section.name }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#6b7385;\">{{ section.countLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-weight:800;font-size:16px;color:{{ section.accent }};\">{{ section.pctLabel }}<\u002Fdiv>\n            <sc-if value=\"{{ section.showToggle }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ section.onToggle }}\" title=\"Expandir ou recolher os itens\" style=\"width:30px;height:30px;border-radius:8px;border:1px solid {{ section.border }};background:#fff;color:{{ section.accent }};cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;font-family:inherit;\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"transform:{{ section.chevRot }};transition:transform .2s;\"><polyline points=\"9 18 15 12 9 6\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ section.showItems }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-for list=\"{{ section.items }}\" as=\"item\" hint-placeholder-count=\"6\">\n            <div style=\"background:#fff;border:1px solid #e7eaf2;border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 1px rgba(20,30,60,.03);\">\n              <div style=\"display:flex;align-items:flex-start;gap:10px;padding:12px 13px;\">\n                <div style=\"flex:none;display:flex;gap:5px;\">\n                  <button onclick=\"{{ item.onSim }}\" title=\"Sim\" style=\"width:27px;height:27px;border-radius:7px;border:1.5px solid {{ item.simBorder }};background:{{ item.simBg }};color:{{ item.simColor }};font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;\">S<\u002Fbutton>\n                  <button onclick=\"{{ item.onNao }}\" title=\"Não\" style=\"width:27px;height:27px;border-radius:7px;border:1.5px solid {{ item.naoBorder }};background:{{ item.naoBg }};color:{{ item.naoColor }};font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;\">N<\u002Fbutton>\n                <\u002Fdiv>\n                <div onclick=\"{{ item.onExpand }}\" style=\"flex:1;cursor:pointer;font-size:13.5px;font-weight:600;line-height:1.35;color:{{ item.titleColor }};\">{{ item.title }}<\u002Fdiv>\n                <button onclick=\"{{ item.onExpand }}\" style=\"flex:none;border:none;background:none;padding:0;margin-top:1px;cursor:pointer;color:#aab1c2;display:flex;align-items:center;\">\n                  <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 16v-4\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ item.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-top:1px solid #eef0f6;background:#fafbfe;padding:14px 14px 16px;\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:13px;\">\n                    <div style=\"font-weight:700;font-size:14px;color:{{ item.accent }};line-height:1.3;\">{{ item.title }}<\u002Fdiv>\n                    <button onclick=\"{{ item.onExpand }}\" style=\"flex:none;border:none;background:none;padding:0;cursor:pointer;color:#8a92a3;display:flex;\">\n                      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n\n                  <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#1f2733;margin-bottom:4px;\">Condição avaliada<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#525a6b;line-height:1.5;margin-bottom:13px;\">{{ item.formulacao }}<\u002Fdiv>\n\n                  <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#1f2733;margin-bottom:4px;\">Escopo avaliado<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#525a6b;line-height:1.5;margin-bottom:13px;\">{{ item.escopoLabel }}<\u002Fdiv>\n\n                  <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#1f2733;margin-bottom:4px;\">Por que importa<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#525a6b;line-height:1.5;margin-bottom:13px;\">{{ item.descricao }}<\u002Fdiv>\n\n                  \n\n                  <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:{{ item.accent }};margin-bottom:7px;\">Questões de apoio<\u002Fdiv>\n                  <sc-for list=\"{{ item.questoes }}\" as=\"q\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;gap:8px;margin-bottom:7px;font-size:12.5px;color:#525a6b;line-height:1.45;\">\n                      <span style=\"color:{{ item.accent }};font-weight:700;flex:none;\">•<\u002Fspan>\n                      <span>{{ q }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n          <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e6e9f2;border-radius:14px;padding:20px 24px;box-shadow:0 1px 2px rgba(20,30,60,.04);margin-top:24px;\">\n      <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:18px;\">\n        <span style=\"display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:#eef1f7;color:#1f2733;flex:none;\">\n          <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><rect x=\"7\" y=\"9\" width=\"3\" height=\"9\"><\u002Frect><rect x=\"14\" y=\"5\" width=\"3\" height=\"13\"><\u002Frect><\u002Fsvg>\n        <\u002Fspan>\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"font-size:16px;font-weight:700;color:#1f2733;\">Panorama das condições<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7385;\">Condições presentes e ausentes na organização<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#6b7385;margin-bottom:7px;\">\n        <span style=\"font-weight:600;color:#1f2733;\">Presentes vs Ausentes<\u002Fspan>\n        <span>{{ presenceLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:8px;border-radius:999px;background:#eceff5;overflow:hidden;display:flex;\">\n        <div style=\"height:100%;width:{{ presentSegW }};background:#1f9d6b;transition:width .35s ease;\"><\u002Fdiv>\n        <div style=\"height:100%;width:{{ absentSegW }};background:#d9534f;transition:width .35s ease;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;\">\n        <div style=\"border:1px solid #e9ecf4;border-radius:10px;padding:13px 15px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;\">\n            <span style=\"display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#37404f;\"><span style=\"display:flex;color:#1f2733;flex:none;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fspan>Pessoas<\u002Fspan>\n            <span style=\"font-size:13px;font-weight:700;color:#1f2733;\">{{ pessoas.presentPctLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:6px;border-radius:999px;background:#eceff5;overflow:hidden;display:flex;\"><div style=\"height:100%;width:{{ pessoas.presentSegW }};background:#1f9d6b;transition:width .35s ease;\"><\u002Fdiv><div style=\"height:100%;width:{{ pessoas.absentSegW }};background:#d9534f;transition:width .35s ease;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;color:#8a92a3;margin-top:7px;text-align:right;\">{{ pessoas.presentShort }}<\u002Fdiv>\n          <sc-if value=\"{{ pessoas.hasAbsent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;border-top:1px solid #f0e0df;padding-top:9px;\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#c0392b;margin-bottom:7px;\">Condições ausentes<\u002Fdiv>\n              <sc-for list=\"{{ pessoas.absentItems }}\" as=\"ab\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;gap:8px;margin-bottom:7px;font-size:12.5px;color:#525a6b;line-height:1.45;\">\n                  <span style=\"color:#c0392b;font-weight:700;flex:none;\">•<\u002Fspan>\n                  <span><span style=\"color:#c0392b;font-weight:700;\">{{ ab.t }}:<\u002Fspan> {{ ab.x }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ pessoas.hasPending }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;border-top:1px solid #e9ecf4;padding-top:9px;\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8a92a3;margin-bottom:7px;\">Condições não avaliadas<\u002Fdiv>\n              <sc-for list=\"{{ pessoas.pendingItems }}\" as=\"pd\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;gap:8px;margin-bottom:7px;font-size:12.5px;color:#8a92a3;line-height:1.45;\">\n                  <span style=\"color:#8a92a3;font-weight:700;flex:none;\">•<\u002Fspan>\n                  <span>{{ pd.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e9ecf4;border-radius:10px;padding:13px 15px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;\">\n            <span style=\"display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#37404f;\"><span style=\"display:flex;color:#1f2733;flex:none;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"><\u002Fpath><\u002Fsvg><\u002Fspan>Processos<\u002Fspan>\n            <span style=\"font-size:13px;font-weight:700;color:#1f2733;\">{{ processos.presentPctLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:6px;border-radius:999px;background:#eceff5;overflow:hidden;display:flex;\"><div style=\"height:100%;width:{{ processos.presentSegW }};background:#1f9d6b;transition:width .35s ease;\"><\u002Fdiv><div style=\"height:100%;width:{{ processos.absentSegW }};background:#d9534f;transition:width .35s ease;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;color:#8a92a3;margin-top:7px;text-align:right;\">{{ processos.presentShort }}<\u002Fdiv>\n          <sc-if value=\"{{ processos.hasAbsent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;border-top:1px solid #f0e0df;padding-top:9px;\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#c0392b;margin-bottom:7px;\">Condições ausentes<\u002Fdiv>\n              <sc-for list=\"{{ processos.absentItems }}\" as=\"ab\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;gap:8px;margin-bottom:7px;font-size:12.5px;color:#525a6b;line-height:1.45;\">\n                  <span style=\"color:#c0392b;font-weight:700;flex:none;\">•<\u002Fspan>\n                  <span><span style=\"color:#c0392b;font-weight:700;\">{{ ab.t }}:<\u002Fspan> {{ ab.x }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ processos.hasPending }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;border-top:1px solid #e9ecf4;padding-top:9px;\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8a92a3;margin-bottom:7px;\">Condições não avaliadas<\u002Fdiv>\n              <sc-for list=\"{{ processos.pendingItems }}\" as=\"pd\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;gap:8px;margin-bottom:7px;font-size:12.5px;color:#8a92a3;line-height:1.45;\">\n                  <span style=\"color:#8a92a3;font-weight:700;flex:none;\">•<\u002Fspan>\n                  <span>{{ pd.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e9ecf4;border-radius:10px;padding:13px 15px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;\">\n            <span style=\"display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#37404f;\"><span style=\"display:flex;color:#1f2733;flex:none;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M8 21h8\"><\u002Fpath><path d=\"M12 17v4\"><\u002Fpath><\u002Fsvg><\u002Fspan>Tecnologia<\u002Fspan>\n            <span style=\"font-size:13px;font-weight:700;color:#1f2733;\">{{ tecnologia.presentPctLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:6px;border-radius:999px;background:#eceff5;overflow:hidden;display:flex;\"><div style=\"height:100%;width:{{ tecnologia.presentSegW }};background:#1f9d6b;transition:width .35s ease;\"><\u002Fdiv><div style=\"height:100%;width:{{ tecnologia.absentSegW }};background:#d9534f;transition:width .35s ease;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;color:#8a92a3;margin-top:7px;text-align:right;\">{{ tecnologia.presentShort }}<\u002Fdiv>\n          <sc-if value=\"{{ tecnologia.hasAbsent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;border-top:1px solid #f0e0df;padding-top:9px;\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#c0392b;margin-bottom:7px;\">Condições ausentes<\u002Fdiv>\n              <sc-for list=\"{{ tecnologia.absentItems }}\" as=\"ab\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;gap:8px;margin-bottom:7px;font-size:12.5px;color:#525a6b;line-height:1.45;\">\n                  <span style=\"color:#c0392b;font-weight:700;flex:none;\">•<\u002Fspan>\n                  <span><span style=\"color:#c0392b;font-weight:700;\">{{ ab.t }}:<\u002Fspan> {{ ab.x }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ tecnologia.hasPending }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:10px;border-top:1px solid #e9ecf4;padding-top:9px;\">\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8a92a3;margin-bottom:7px;\">Condições não avaliadas<\u002Fdiv>\n              <sc-for list=\"{{ tecnologia.pendingItems }}\" as=\"pd\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;gap:8px;margin-bottom:7px;font-size:12.5px;color:#8a92a3;line-height:1.45;\">\n                  <span style=\"color:#8a92a3;font-weight:700;flex:none;\">•<\u002Fspan>\n                  <span>{{ pd.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1416,&quot;height&quot;:960},&quot;corPessoas&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3b6fe0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;corProcessos&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c0891c&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;corTecnologia&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7355d6&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mostrarFator&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.KEY = 'tdmready_answers_v3_1';\n    this.state = { answers: {}, expanded: {}, secOpen: {}, showHelp: false };\n    this.RAW = [\n      { key:'pessoas', name:'Pessoas', items:[\n        { id:'IT-PES-01', escopo:'Área', title:'Disponibilidade de profissionais qualificados',\n          ausencia:'as atividades do GDT são sempre adiadas em favor das entregas.',\n          formulacao:'A organização conta, nas suas equipes atuais, com profissionais qualificados e disponíveis para conduzir as atividades de gerenciamento da dívida técnica, incorporadas ao fluxo de trabalho existente.',\n          descricao:'O esforço das atividades do GDT é recorrentemente subestimado. O que se avalia é a folga real de capacidade no fluxo de trabalho corrente, e não a existência de uma equipe dedicada à dívida técnica. Quando ausente, as atividades do GDT são sempre adiadas em favor das entregas.',\n          fator:'PES-01 - Escassez de profissionais qualificados (-)',\n          questoes:['Há profissionais com experiência em qualidade de software e DT na equipe atual?','A equipe consegue assumir atividades de DT sem comprometer as entregas correntes?','Já houve atividades de DT que não avançaram por falta de gente qualificada?'] },\n        { id:'IT-PES-02', escopo:'Área', title:'Conhecimento técnico sobre DT',\n          ausencia:'a equipe não reconhece a DT no código e as atividades de gerenciamento não conseguem ser executadas.',\n          formulacao:'Os profissionais possuem conhecimento técnico sobre a dívida técnica, suas causas e suas consequências.',\n          descricao:'O conhecimento técnico é a base individual para identificar, prevenir e pagar a dívida. Quando ausente, a equipe não reconhece a DT no código e as atividades de gerenciamento não conseguem ser executadas.',\n          fator:'PES-02 - Falta de conhecimento técnico (-)',\n          questoes:['A equipe sabe identificar tecnicamente DT no código e na arquitetura, por exemplo em revisões?','Os profissionais compreendem as causas e as consequências técnicas da DT?','Há formação, treinamento ou material sobre DT disponível à equipe?'] },\n        { id:'IT-PES-03', escopo:'Organização', title:'Entendimento comum sobre DT',\n          ausencia:'a comunicação e a priorização da DT se perdem em ruído, pois cada envolvido entende o termo de um jeito.',\n          formulacao:'Os envolvidos compartilham um entendimento comum dos conceitos fundamentais relacionados à dívida técnica e à qualidade do software.',\n          descricao:'O vocabulário comum é a base da coordenação coletiva em torno da dívida. Quando ausente, a comunicação e a priorização da DT se perdem em ruído, pois cada envolvido entende o termo de um jeito.',\n          fator:'PES-03 - Falta de entendimento comum de conceitos fundamentais de SW (-)',\n          questoes:['Há um entendimento comum do que é e do que não é dívida técnica entre os envolvidos?','O termo dívida técnica é usado para apontar bugs, tarefas não entregues ou atividades de rotina?','Existe algum glossário, definição adotada ou material de referência compartilhado sobre DT?'] },\n        { id:'IT-PES-04', escopo:'Área', title:'Consciência da equipe sobre a DT',\n          ausencia:'a dívida deixa de ser tratada por falta de visibilidade do tema.',\n          formulacao:'A equipe reconhece a DT como um tema relevante e está consciente dos seus impactos no trabalho.',\n          descricao:'A consciência coletiva dá visibilidade ao tema e sustenta o engajamento no GDT. Quando ausente, a dívida deixa de ser tratada por falta de visibilidade, e não por descaso da equipe.',\n          fator:'PES-04 - Aumento da consciência e entendimento sobre DT (+)',\n          questoes:['A DT é tema recorrente nas discussões da equipe, como retrospectivas e revisões?','Os membros conseguem citar impactos concretos que a DT já causou no trabalho?','A equipe percebe valor em tratar a DT, e não a vê como perda de tempo?'] },\n        { id:'IT-PES-05', escopo:'Organização', title:'Incentivos ao engajamento na DT',\n          ausencia:'o engajamento no GDT tende a se perder para as demandas de maior vitrine.',\n          formulacao:'A organização utiliza incentivos para motivar e engajar a equipe nas práticas de gerenciamento da dívida técnica.',\n          descricao:'Tratar a dívida compete com o trabalho mais visível de entregar funcionalidades. Os incentivos sustentam a motivação e tornam o esforço reconhecido. Quando ausentes, o engajamento no GDT tende a se perder para as demandas de maior vitrine.',\n          fator:'PES-05 - Estratégia de incentivos (motivação e eficiência) (+)',\n          questoes:['Existe algum reconhecimento ou incentivo, formal ou informal, para quem trata a DT?','O esforço dedicado à DT é valorizado, e não invisível?','Já houve alguma iniciativa, como campanha, gamificação ou metas, para engajar na DT?'] },\n        { id:'IT-PES-06', escopo:'Organização', title:'Harmonização entre técnicos e gestão',\n          ausencia:'as divergências não tratadas travam as decisões do GDT.',\n          formulacao:'As diferentes perspectivas entre papéis técnicos e de gestão sobre a dívida técnica são harmonizadas em direção a uma visão coesa.',\n          descricao:'A harmonização das perspectivas permite uma priorização coerente da dívida. Quando ausente, as divergências não tratadas entre técnicos e gestão travam as decisões do GDT.',\n          fator:'PES-06 - Harmonizar perspectivas técnicas/gestão sobre as práticas de GDT (+)',\n          questoes:['Técnicos e gestores têm uma visão alinhada sobre o que priorizar em DT?','Existe espaço de diálogo para conciliar divergências entre esses papéis?','Há registro de decisões de DT em que perspectivas técnicas e gerenciais foram conciliadas?'] },\n        { id:'IT-PES-07', escopo:'Organização', title:'Apoio da gestão de negócio à DT',\n          ausencia:'a resistência desse papel inviabiliza a prática, por mais que a equipe técnica se esforce.',\n          formulacao:'Os gestores de negócio apoiam as práticas de gerenciamento da dívida técnica, sem bloqueá-las apenas pelo impacto imediato em prazo e custo.',\n          descricao:'O apoio da gestão de negócio garante o financiamento e o tempo de que o GDT depende. Quando ausente, a resistência desse papel inviabiliza a prática, por mais que a equipe técnica se esforce.',\n          fator:'PES-07 - Gestores de negócios resistem por impacto em prazo e custo (-)',\n          questoes:['Os gestores de negócio já aprovaram esforços de DT mesmo com impacto em prazo ou custo?','Há abertura para discutir DT com a gestão de negócio sem resistência imediata?','Iniciativas de DT costumam ser barradas pela gestão de negócio?'] },\n        { id:'IT-PES-08', escopo:'Área', title:'Valorização da qualidade interna',\n          ausencia:'a qualidade cede sistematicamente às entregas de curto prazo e a dívida cresce de forma estrutural.',\n          formulacao:'As pessoas valorizam a qualidade interna do software, como a manutenibilidade, a legibilidade e a testabilidade, nas decisões de desenvolvimento, mesmo diante da pressão por novas funcionalidades.',\n          descricao:'A valorização da qualidade interna previne o acúmulo contínuo de DT e impulsiona a adoção do GDT. Quando ausente, a qualidade cede sistematicamente às entregas de curto prazo e a dívida cresce de forma estrutural.',\n          fator:'PES-08 - Falta de preocupação com a manutenibilidade (-) PES-09 - Preocupação com a qualidade (+)',\n          questoes:['A manutenibilidade e a qualidade interna são consideradas nas revisões e decisões técnicas?','A qualidade é tratada como prioridade declarada, e não negociável a cada demanda nova?','Diante de novas funcionalidades, a equipe evita soluções que geram DT sem necessidade?','Há exemplos recentes de decisões ou iniciativas motivadas pela qualidade interna?'] },\n        { id:'IT-PES-09', escopo:'Organização', title:'Equilíbrio entre curto e longo prazo',\n          ausencia:'com o curto prazo dominando sozinho, a dívida nunca é priorizada.',\n          formulacao:'A cultura da organização equilibra as metas de curto prazo com a sustentabilidade de longo prazo do software.',\n          descricao:'A vantagem do equilíbrio é preservar a capacidade futura de entrega, pois tratar a dívida em ritmo constante evita que ela corroa a velocidade e a qualidade das próximas entregas. Quando o curto prazo domina sozinho, a dívida nunca é priorizada.',\n          fator:'PES-10 - Foco somente no curto prazo (-)',\n          questoes:['Decisões levam em conta consequências de longo prazo, e não só a entrega imediata?','As pessoas tentam defender ações técnicas que demandam investimentos cujo retorno não é imediato?'] }\n      ] },\n      { key:'processos', name:'Processos', items:[\n        { id:'IT-PRO-01', escopo:'Organização', title:'Impacto da DT como critério de decisão',\n          ausencia:'as decisões sobre a DT são implícitas e reativas.',\n          formulacao:'A organização analisa o impacto da dívida técnica e o considera como critério nas suas decisões de projeto e priorização.',\n          descricao:'O impacto abrange os custos gerados pela DT e os riscos do seu acúmulo. Analisá-lo dá ao GDT base gerencial para ser priorizado. Quando ausente, as decisões sobre a DT são implícitas e reativas.',\n          fator:'PRO-01 - Reduzir custos (+) PRO-10 - Melhorar a análise de risco e mapear o impacto da DT (+)',\n          questoes:['Existe alguma estimativa, mesmo aproximada, do custo que a DT gera hoje, como retrabalho, manutenção e atrasos?','Existe mapeamento ou registro dos riscos e impactos associados à DT?','Custo e risco são usados como argumento ao priorizar o que tratar primeiro?','Há registro de decisões de projeto em que o custo da DT pesou?'] },\n        { id:'IT-PRO-02', escopo:'Organização', title:'GDT como aliado da entrega',\n          ausencia:'visto apenas como atraso, o GDT é preterido nas decisões de planejamento.',\n          formulacao:'Nas decisões de planejamento, a organização trata o gerenciamento da dívida técnica como contribuinte para os objetivos de entrega, e não apenas como custo que os retarda.',\n          descricao:'Quando o GDT é percebido como acelerador da entrega, por evitar retrabalho e manter uma velocidade sustentável, a organização se dispõe a incorporá-lo ao fluxo. Quando é visto apenas como atraso, ele é preterido nas decisões de planejamento.',\n          fator:'PRO-02 - Acelerar os objetivos do projeto (+)',\n          questoes:['Há exemplos em que tratar a DT melhorou a velocidade ou a previsibilidade das entregas?','O GDT é apresentado internamente como apoio aos objetivos do projeto?','O planejamento reserva espaço para atividades de GDT sem vê-las como desperdício?'] },\n        { id:'IT-PRO-03', escopo:'Organização', title:'Equilíbrio entre prazo e qualidade interna',\n          ausencia:'sem contrapeso à pressão por rapidez, a dívida se acumula.',\n          formulacao:'A organização equilibra a pressão por rapidez de entrega com a atenção à dívida técnica, sem sacrificar sistematicamente a qualidade interna em favor do prazo.',\n          descricao:'A pressão de mercado por rapidez é legítima, mas sem contrapeso ela faz a dívida se acumular. A atenção à DT preservada mesmo sob pressão é o que permite ao GDT sobreviver no dia a dia.',\n          fator:'PRO-03 - Pressão para reduzir o tempo de entrega (-)',\n          questoes:['Sob pressão de prazo, a equipe consegue registrar e reservar a DT gerada para tratamento posterior?','Existe algum mecanismo que impeça que toda a capacidade seja consumida por novas funcionalidades?','Há casos recentes em que a entrega foi ajustada para não comprometer a qualidade interna?'] },\n        { id:'IT-PRO-04', escopo:'Organização', title:'Visibilidade da DT para o negócio',\n          ausencia:'invisível para o negócio, o GDT não recebe apoio nem financiamento.',\n          formulacao:'A organização torna a dívida técnica visível para os stakeholders de negócio, comunicando o seu impacto em termos compreensíveis para decisões.',\n          descricao:'A visibilidade em linguagem de negócio é o que habilita o apoio gerencial. Quando a dívida permanece invisível para esses stakeholders, o GDT não recebe apoio nem financiamento.',\n          fator:'PRO-04 - Invisibilidade da DT para stakeholders não técnicos (-)',\n          questoes:['Existe algum relatório, painel ou indicador de DT apresentado a stakeholders não técnicos?','O impacto da DT é comunicado em termos de prazo, custo ou risco de negócio?','Os stakeholders de negócio conseguem citar exemplos de DT e seus efeitos?'] },\n        { id:'IT-PRO-05', escopo:'Área', title:'Integração do GDT ao processo',\n          ausencia:'conduzido como processo separado, o GDT tende a ser abandonado.',\n          formulacao:'As práticas de gerenciamento da dívida técnica estão integradas ao fluxo regular de desenvolvimento, e não conduzidas como processo separado.',\n          descricao:'A integração ao fluxo regular, como sprints, backlog e definição de pronto, torna o GDT sustentável. Quando conduzido como processo separado, ele tende a ser abandonado.',\n          fator:'PRO-05 - TDM tratado como processo separado (-)',\n          questoes:['A DT aparece no mesmo backlog ou quadro das demais atividades?','Existe algum ponto no fluxo, como uma cerimônia ou critério de pronto, em que a DT é tratada de forma rotineira?','O tratamento da DT depende de iniciativas avulsas, fora do processo normal?'] },\n        { id:'IT-PRO-06', escopo:'Organização', title:'Engajamento entre negócio e engenharia',\n          ausencia:'decisões de um lado só falham por ignorar o valor de negócio ou a realidade técnica.',\n          formulacao:'Stakeholders de negócio e de engenharia participam conjuntamente das decisões sobre dívida técnica, integrando valor de negócio e qualidade técnica.',\n          descricao:'O engajamento conjunto sustenta a priorização e o financiamento da dívida. Quando as decisões envolvem só um dos lados, elas falham por ignorar o valor de negócio ou a realidade técnica.',\n          fator:'PRO-06 - Engajamento entre stakeholders de negócio e engenharia (+)',\n          questoes:['Existem fóruns ou reuniões em que negócio e engenharia discutem DT juntos?','As decisões de priorização de DT consideram tanto valor de negócio quanto risco técnico?','Há registro de decisões de DT tomadas conjuntamente?'] },\n        { id:'IT-PRO-07', escopo:'Área', title:'Capacidade reservada para a DT',\n          ausencia:'sem tempo alocado no planejamento, o GDT não acontece, independentemente da intenção.',\n          formulacao:'O planejamento de projetos reserva tempo e capacidade para atividades de prevenção e pagamento da dívida técnica.',\n          descricao:'Sem tempo alocado no planejamento, o GDT não acontece, independentemente da intenção. Reservar capacidade no cronograma é a condição prática que transforma a intenção em atividade.',\n          fator:'PRO-07 - Prazos curtos (-)',\n          questoes:['O cronograma ou o backlog prevê, de forma explícita, esforço para tratar a DT?','Existe alguma alocação recorrente, como um percentual de sprint ou janelas, destinada à DT?','Atividades de DT costumam ser as primeiras cortadas quando o prazo aperta?'] },\n        { id:'IT-PRO-08', escopo:'Organização', title:'Apoio gerencial ao esforço inicial',\n          ausencia:'sem quem banque o esforço inicial, a iniciativa morre cedo.',\n          formulacao:'A organização dispõe de apoio gerencial para sustentar o investimento inicial e o overhead operacional do gerenciamento da dívida técnica.',\n          descricao:'A adoção tem um custo inicial de configuração, regras e avaliação. O apoio gerencial banca esse esforço até a prática se estabilizar. Quando ausente, a iniciativa morre cedo.',\n          fator:'PRO-08 - Sobrecarga inicial dos processos (-)',\n          questoes:['Há patrocínio ou apoio formal da gestão para iniciar o GDT?','Existe disposição de absorver o esforço inicial sem esperar retorno imediato?','Já houve aprovação de recursos, como tempo, ferramentas ou pessoas, para estruturar o GDT?'] },\n        { id:'IT-PRO-09', escopo:'Organização', title:'Objetivo de redução da DT',\n          ausencia:'sem objetivo explícito, as ações sobre a dívida são pontuais e sem continuidade.',\n          formulacao:'A organização possui um objetivo declarado de reduzir os efeitos negativos da dívida técnica, que orienta as suas iniciativas de remediação.',\n          descricao:'Um objetivo explícito dá direção e legitimidade às iniciativas de remediação. Quando ausente, as ações sobre a dívida são pontuais e sem continuidade.',\n          fator:'PRO-09 - Reduzir os efeitos negativos da DT (+)',\n          questoes:['Existe algum objetivo, meta ou política que mencione a redução dos efeitos da DT?','As iniciativas de tratamento da DT se conectam a esse objetivo?','Há acompanhamento de progresso em direção a essa meta?'] }\n      ] },\n      { key:'tecnologia', name:'Tecnologia', items:[\n        { id:'IT-TEC-01', escopo:'Área', title:'Ferramentas de identificação e medição da DT',\n          ausencia:'o gerenciamento parte de percepção subjetiva, sem saber onde a dívida está nem o seu tamanho.',\n          formulacao:'A organização dispõe de ferramentas que identificam e medem a dívida técnica presente no software, com modelos estruturados e compreensíveis pelas equipes.',\n          descricao:'As ferramentas de identificação e medição produzem a fotografia atual da dívida. Quando ausentes, o gerenciamento parte de percepção subjetiva, sem saber onde a dívida está nem o seu tamanho.',\n          fator:'TEC-01 - Complexidade dos modelos de medição (-)',\n          questoes:['Existem métricas padronizadas de DT geradas por ferramenta?','As métricas são compreendidas pelas equipes?','As ferramentas utilizadas são consistentes entre projetos?','Os resultados são utilizados na tomada de decisão?'] },\n        { id:'IT-TEC-02', escopo:'Organização', title:'Ferramentas de avaliação econômica da DT',\n          ausencia:'a priorização carece de base e a DT compete em desvantagem com as entregas de curto prazo.',\n          formulacao:'A organização dispõe de ferramentas e métodos para estimar o impacto econômico da dívida técnica, incluindo abordagens probabilísticas quando aplicável, que apoiam as decisões de custo e de priorização.',\n          descricao:'A estimativa do impacto econômico, inclusive sob incerteza, fundamenta a priorização e a justificativa do pagamento da dívida. Quando ausente, a priorização carece de base e a DT compete em desvantagem com as entregas de curto prazo.',\n          fator:'TEC-02 - Abordagem probabilística para avaliação dos impactos econômicos da DT (+)',\n          questoes:['Há estimativas financeiras associadas à DT produzidas por ferramenta ou método definido?','São utilizados modelos de risco ou cenários?','Existe comparação entre custo de correção e custo de não agir?','A avaliação econômica influencia decisões de priorização?'] },\n        { id:'IT-TEC-03', escopo:'Área', title:'Ferramentas de acompanhamento da evolução da DT',\n          ausencia:'a degradação só é percebida em estágio avançado, quando o custo e o risco já são muito maiores.',\n          formulacao:'A organização dispõe de ferramentas que acompanham a evolução da DT e da degradação arquitetural ao longo do tempo, apoiando a identificação de riscos à longevidade do software.',\n          descricao:'O acompanhamento ao longo do tempo antecipa a degeneração causada pela dívida acumulada e sustenta o GDT no longo prazo. Quando ausente, a degradação só é percebida em estágio avançado, quando o custo de correção e o risco de perda do sistema já são muito maiores.',\n          fator:'TEC-03 - Diminuição da longevidade do software (+)',\n          questoes:['Existem indicadores de qualidade estrutural monitorados por ferramenta?','A arquitetura é avaliada periodicamente?','Há registro de aumento de custos de manutenção?','Problemas recorrentes são analisados sistematicamente?'] }\n      ] }\n    ];\n  }\n\n  componentDidMount(){\n    try {\n      const saved = JSON.parse(localStorage.getItem(this.KEY) || '{}');\n      if (saved && typeof saved === 'object') this.setState({ answers: saved });\n    } catch (e) {}\n  }\n\n  persist(c){ try { localStorage.setItem(this.KEY, JSON.stringify(c)); } catch (e) {} }\n\n  answer(id, val){\n    this.setState(s => {\n      const a = Object.assign({}, s.answers);\n      if (a[id] === val) delete a[id]; else a[id] = val;\n      this.persist(a);\n      const o = Object.assign({}, s.secOpen);\n      this.RAW.forEach(g => {\n        if (g.items.some(it => it.id === id)) {\n          const before = g.items.filter(it => s.answers[it.id]).length;\n          const after = g.items.filter(it => a[it.id]).length;\n          if (before < g.items.length && after === g.items.length) o[g.key] = false;\n        }\n      });\n      return { answers: a, secOpen: o };\n    });\n  }\n\n  toggleSection(key){\n    this.setState(s => {\n      const o = Object.assign({}, s.secOpen);\n      o[key] = !o[key];\n      return { secOpen: o };\n    });\n  }\n\n  toggleExpand(id){\n    this.setState(s => {\n      const e = Object.assign({}, s.expanded);\n      e[id] = !e[id];\n      return { expanded: e };\n    });\n  }\n\n  toggleHelp(){\n    this.setState(s => ({ showHelp: !s.showHelp }));\n  }\n\n  resetAll(){\n    this.persist({});\n    this.setState({ answers: {} });\n  }\n\n  renderVals(){\n    const p = this.props || {};\n    const accents = {\n      pessoas: p.corPessoas || '#3b6fe0',\n      processos: p.corProcessos || '#c0891c',\n      tecnologia: p.corTecnologia || '#7355d6'\n    };\n    const lighten = (hex, t) => {\n      const h = hex.replace('#','');\n      const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);\n      const ch = v => Math.round(255 + (v - 255) * t).toString(16).padStart(2,'0');\n      return '#' + ch(r) + ch(g) + ch(b);\n    };\n    const showFator = p.mostrarFator !== false;\n    const answers = this.state.answers, expanded = this.state.expanded, secOpen = this.state.secOpen;\n\n    let total = 0, totalDone = 0, presentTotal = 0, sectionsDone = 0;\n    const sections = this.RAW.map(g => {\n      const accent = accents[g.key];\n      const items = g.items.map(it => {\n        const ans = answers[it.id];\n        const simSel = ans === 'S', naoSel = ans === 'N';\n        return Object.assign({}, it, {\n          answered: !!ans,\n          isSim: simSel,\n          escopoLabel: it.escopo || '',\n          expanded: !!expanded[it.id],\n          accent: accent,\n          showFator: showFator,\n          simBg: simSel ? '#1f9d6b' : '#ffffff',\n          simColor: simSel ? '#ffffff' : '#1f9d6b',\n          simBorder: simSel ? '#1f9d6b' : '#cfe7da',\n          naoBg: naoSel ? '#d9534f' : '#ffffff',\n          naoColor: naoSel ? '#ffffff' : '#d9534f',\n          naoBorder: naoSel ? '#d9534f' : '#f0d2d0',\n          titleColor: ans ? '#8a92a3' : '#1f2733',\n          onSim: () => this.answer(it.id, 'S'),\n          onNao: () => this.answer(it.id, 'N'),\n          onExpand: () => this.toggleExpand(it.id)\n        });\n      });\n      const done = items.filter(i => i.answered).length;\n      const present = items.filter(i => i.isSim).length;\n      total += items.length; totalDone += done; presentTotal += present;\n      if (items.length > 0 && done === items.length) sectionsDone++;\n      const pct = items.length ? Math.round(done / items.length * 100) : 0;\n      const pctPresent = items.length ? Math.round(present / items.length * 100) : 0;\n      return {\n        key: g.key, name: g.name, accent, tint: lighten(accent, 0.10), border: lighten(accent, 0.30),\n        items, done, present, count: items.length, pct, pctPresent,\n        pctLabel: pct + '%',\n        barWidth: pct + '%',\n        countLabel: done + ' de ' + items.length + ' itens respondidos',\n        countShort: done + '/' + items.length + ' itens',\n        presentPctLabel: pctPresent + '%',\n        presentBarWidth: pctPresent + '%',\n        presentSegW: (items.length ? (present / items.length * 100) : 0) + '%',\n        absentSegW: (items.length ? ((done - present) / items.length * 100) : 0) + '%',\n        isComplete: (items.length > 0 && done === items.length),\n        showItems: (secOpen[g.key] === undefined) ? true : !!secOpen[g.key],\n        showToggle: true,\n        chevRot: ((secOpen[g.key] === undefined) ? true : !!secOpen[g.key]) ? 'rotate(90deg)' : 'rotate(0deg)',\n        headMargin: ((secOpen[g.key] === undefined) ? true : !!secOpen[g.key]) ? '14px' : '0px',\n        onToggle: () => this.toggleSection(g.key),\n        presentShort: present + '/' + items.length + ' condições presentes',\n        absentItems: items.filter(i => i.answered && !i.isSim).map(i => ({ t: i.title, x: i.ausencia })),\n        hasAbsent: items.some(i => i.answered && !i.isSim),\n        pendingItems: items.filter(i => !i.answered).map(i => ({ t: i.title })),\n        hasPending: items.some(i => !i.answered),\n        isPessoas: g.key === 'pessoas',\n        isProcessos: g.key === 'processos',\n        isTecnologia: g.key === 'tecnologia'\n      };\n    });\n\n    const pctTotal = total ? Math.round(totalDone / total * 100) : 0;\n    const pctPresentTotal = total ? Math.round(presentTotal / total * 100) : 0;\n    return {\n      sections,\n      pessoas: sections[0], processos: sections[1], tecnologia: sections[2],\n      total, totalDone, pending: total - totalDone,\n      pctTotal, pctTotalLabel: pctTotal + '%',\n      overallWidth: pctTotal + '%',\n      totalLabel: totalDone + '/' + total,\n      presentTotal, pctPresentLabel: pctPresentTotal + '%',\n      presentWidth: pctPresentTotal + '%',\n      presentTotalLabel: presentTotal + '/' + total,\n      absentTotal: totalDone - presentTotal,\n      presentSegW: (total ? (presentTotal / total * 100) : 0) + '%',\n      absentSegW: (total ? ((totalDone - presentTotal) / total * 100) : 0) + '%',\n      presenceLabel: (function(){ var abs = totalDone - presentTotal; var pend = total - totalDone; return presentTotal + (presentTotal === 1 ? ' presente' : ' presentes') + ' · ' + abs + (abs === 1 ? ' ausente' : ' ausentes') + ' · ' + pend + (pend === 1 ? ' não avaliado' : ' não avaliados'); })(),\n      sectionsLabel: sectionsDone + '/3',\n      showHelp: !!this.state.showHelp,\n      onToggleHelp: () => this.toggleHelp(),\n      reset: () => this.resetAll()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
